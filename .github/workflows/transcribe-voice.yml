name: Transcribe owner voice (Universe Of Animals)

# The channel owner's own voice recordings (animals/voice/*.aac|m4a|mp3|wav|ogg) are
# transcribed with word timestamps so the daily Short task can cut his lines into videos.
# Output: animals/voice/<name>.json (segments + words) and <name>.txt
on:
  push:
    branches: [main]
    paths: ['animals/voice/**.aac', 'animals/voice/**.m4a', 'animals/voice/**.mp3', 'animals/voice/**.wav', 'animals/voice/**.ogg', 'animals/voice/**.opus']
  workflow_dispatch:

concurrency:
  group: transcribe-voice
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q faster-whisper
      - name: Transcribe
        run: |
          python3 - <<'PY' 2>&1 | tee animals/voice/_transcribe_log.txt
          import json, pathlib, subprocess, traceback
          try:
              from faster_whisper import WhisperModel
              m = WhisperModel('small', device='cpu', compute_type='int8')
          except Exception:
              traceback.print_exc(); raise SystemExit(0)
          for f in sorted(pathlib.Path('animals/voice').iterdir()):
              if f.suffix.lower() not in ('.aac', '.m4a', '.mp3', '.wav', '.ogg', '.opus'):
                  continue
              out = f.with_suffix('.json')
              if out.exists():
                  continue
              wav = f'/tmp/{f.stem}.wav'
              subprocess.run(['ffmpeg', '-y', '-v', 'error', '-i', str(f), '-ac', '1', '-ar', '16000', wav], check=True)
              try:
                  segs, info = m.transcribe(wav, language='tr', word_timestamps=True)
                  segs = list(segs)
              except Exception:
                  traceback.print_exc(); continue
              data = {'file': f.name, 'segments': []}
              for s in segs:
                  data['segments'].append({'start': round(s.start, 2), 'end': round(s.end, 2), 'text': s.text.strip(),
                                           'words': [{'w': w.word.strip(), 's': round(w.start, 2), 'e': round(w.end, 2)} for w in (s.words or [])]})
              out.write_text(json.dumps(data, ensure_ascii=False, indent=1))
              f.with_suffix('.txt').write_text('\n'.join(f"{x['start']:6.2f}-{x['end']:6.2f}  {x['text']}" for x in data['segments']))
              print(f.name, len(data['segments']), 'segments')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add animals/voice/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Ses kaydı yazıya çevrildi" && git pull --rebase && git push)
