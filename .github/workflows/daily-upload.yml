name: Daily YouTube Upload & Schedule

on:
  release:
    types: [published]
  schedule:
    # Her gün 07:00 UTC (Türkiye Saati ile 10:00 TSİ)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      video_download_url:
        description: 'Doğrudan Video İndirme Linki (Opsiyonel - Boş bırakılırsa Google Drive taranır)'
        required: false
        type: string
        default: ''
      auto_schedule:
        description: 'Kanal Yayın Takvimine Otomatik Zamanla (Salı 22:00 / Cmt 17:00 TSİ)'
        required: false
        type: boolean
        default: true
      privacy_status:
        description: 'Zamanlama kapalıysa Gizlilik Durumu'
        required: false
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

concurrency:
  group: youtube-daily-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Cloud Video Upload & YouTube Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (ffmpeg & ffprobe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-upload.txt

      - name: Download Video from GitHub Release (If triggered by Release)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ github.event.release.id }}
          REPO: ${{ github.repository }}
        run: |
          echo "🚀 GitHub Release tetiklendi (ID: $RELEASE_ID). Varlıklar indiriliyor..."
          mkdir -p release_assets
          python -c "
          import os, requests
          token = os.environ.get('GH_TOKEN')
          rel_id = os.environ.get('RELEASE_ID')
          repo = os.environ.get('REPO')
          headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github.v3+json'}
          r = requests.get(f'https://api.github.com/repos/{repo}/releases/{rel_id}', headers=headers).json()
          assets = r.get('assets', [])
          print(f'Bulunan varlık sayısı: {len(assets)}')
          for a in assets:
              name = a['name']
              url = a['url']
              print(f'  İndiriliyor: {name} ({a.get(\"size\", 0)/(1024*1024):.1f} MB)...')
              down_headers = {'Authorization': f'token {token}', 'Accept': 'application/octet-stream'}
              with requests.get(url, headers=down_headers, stream=True) as resp:
                  resp.raise_for_status()
                  with open(os.path.join('release_assets', name), 'wb') as f:
                      for chunk in resp.iter_content(chunk_size=1024*1024*4):
                          if chunk: f.write(chunk)
          print('✅ Tüm release varlıkları başarıyla indirildi.')
          "
          # İlk video dosyasını LOCAL_VIDEO_PATH olarak dışa aktar
          V_PATH=$(find release_assets -type f \( -name "*.mp4" -o -name "*.mov" -o -name "*.mkv" \) | head -n 1)
          if [ -n "$V_PATH" ]; then
            echo "LOCAL_VIDEO_PATH=$PWD/$V_PATH" >> $GITHUB_ENV
            echo "🎯 İşlenecek video: $PWD/$V_PATH"
          fi

      - name: Run YouTube Cloud Uploader
        env:
          # YouTube OAuth Kimlik Bilgileri (GitHub Secrets)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

          # Google Drive / Bulut Depolama Bilgileri (GitHub Secrets)
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}

          # Workflow Dispatch Girişleri veya Varsayılanlar
          VIDEO_DOWNLOAD_URL: ${{ inputs.video_download_url }}
          AUTO_SCHEDULE: ${{ inputs.auto_schedule != false }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy_status || 'private' }}
        run: |
          python tools/upload_to_youtube.py
