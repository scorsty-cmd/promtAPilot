name: Daily YouTube Upload & Schedule

on:
  schedule:
    # Her gün 07:00 UTC (Türkiye Saati ile 10:00 TSİ)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      video_download_url:
        description: 'Doğrudan Video İndirme Linki (Opsiyonel - Boş bırakılırsa Google Drive taranır)'
        required: false
        type: string
        default: ''
      auto_schedule:
        description: 'Kanal Yayın Takvimine Otomatik Zamanla (Salı 22:00 / Cmt 17:00 TSİ)'
        required: false
        type: boolean
        default: true
      privacy_status:
        description: 'Zamanlama kapalıysa Gizlilik Durumu'
        required: false
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

concurrency:
  group: youtube-daily-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Cloud Video Upload & YouTube Schedule
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (ffmpeg & ffprobe)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-upload.txt

      - name: Run YouTube Cloud Uploader
        env:
          # YouTube OAuth Kimlik Bilgileri (GitHub Secrets)
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

          # Google Drive / Bulut Depolama Bilgileri (GitHub Secrets)
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT_KEY: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}

          # Workflow Dispatch Girişleri veya Varsayılanlar
          VIDEO_DOWNLOAD_URL: ${{ inputs.video_download_url }}
          AUTO_SCHEDULE: ${{ inputs.auto_schedule != false }}
          YOUTUBE_PRIVACY_STATUS: ${{ inputs.privacy_status || 'private' }}
        run: |
          python tools/upload_to_youtube.py
